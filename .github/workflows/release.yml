name: Release

# Tag a version to publish @pedra-ai/sdk to npm (with provenance):
#   npm version patch|minor|major   # bumps package.json + creates the tag
#   git push origin main --tags
# or bump the version by hand, then: git tag v0.2.1 && git push origin v0.2.1
#
# npm publishing uses Trusted Publishing: npm checks this workflow's GitHub
# OIDC identity (configured on the package's npm settings page: repo
# pedra-ai/pedra-node, workflow release.yml), so there is no token to store or
# renew. It needs npm >= 11.5.1, hence the npm upgrade step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - run: npm install
      - run: npm test

      - name: Publish to npm
        # No token: npm exchanges the workflow's OIDC identity for a one-off
        # publish token. setup-node sets a placeholder NODE_AUTH_TOKEN, cleared
        # here so npm can't try (and fail with a 404) on that instead.
        run: npm publish --provenance --access public --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ""
